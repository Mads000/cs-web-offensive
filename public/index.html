 <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

        #scope {
            position: absolute;

            background: radial-gradient(circle at center, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 36vh, #000 37vh)
        }

        #scope:before,
        #scope:after {
            content: '';
            position: absolute;
            background: #000
        }

        #scope:before {
            left: 0;
            right: 0;
            top: 50%;
            height: 1px
        }

        #scope:after {
            top: 0;
            bottom: 0;
            left: 50%;
            width: 1px
        }
