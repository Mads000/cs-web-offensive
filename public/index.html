<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>CLUTCH – Taktik-Shooter</title>

    <link rel="icon" type="image/png" href="icon-192.png">
    <!-- PWA: als App installierbar (eigenes Icon, ohne Adressleiste) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1015">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CLUTCH">
    <style>
        /* Ladebildschirm – steht vor allem anderen, damit er sofort sichtbar ist */
        #loader { position: fixed; inset: 0; z-index: 100000; background: radial-gradient(circle at 50% 40%, #1a2430, #0b1015 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .5s; font-family: Arial, sans-serif }
        #loader.done { opacity: 0; pointer-events: none }
        #loader img { width: 110px; height: 110px; border-radius: 22px; box-shadow: 0 0 40px rgba(var(--hl-rgb), .25); animation: ldPulse 1.6s ease-in-out infinite }
        #loader b { font: 900 30px 'Arial Black', Impact, sans-serif; letter-spacing: 6px; color: var(--hl) }
        #loader i { display: block; width: min(320px, 70vw); height: 6px; background: rgba(255, 255, 255, .1); border-radius: 3px; overflow: hidden }
        #loader i::after { content: ''; display: block; height: 100%; width: 100%; background: var(--hl); transform-origin: left; animation: ldBar 6s cubic-bezier(.1, .7, .3, 1) forwards }
        #loader.done i::after { animation: none; transform: scaleX(1) }
        #loader small { color: #8fa3b8; font-size: 13px; letter-spacing: 1px }
        @keyframes ldBar { from { transform: scaleX(0) } to { transform: scaleX(.92) } }
        @keyframes ldPulse { 50% { transform: scale(1.05) } }
        /* Kein Browser-Gefühl: nichts markieren/ziehen, kein Antipp-Menü, kein Doppeltipp-Zoom, eigener Mauszeiger */
        html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; overscroll-behavior: none }
        input, textarea, select { -webkit-user-select: text; user-select: text }
        img, canvas { -webkit-user-drag: none }
        body { cursor: default } /* Windows-Standardcursor */
        button, a, [data-nav], [data-cat], .mapc, .arc, label, select { cursor: pointer }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Noto+Emoji:wght@400;600&display=swap" rel="stylesheet">
    <!-- Design: neu (Standard) oder altes CS-Design per ?design=cs – wird gespeichert, zurück mit ?design=neu -->
    <script>try { const q = new URLSearchParams(location.search).get('design'); if (q) localStorage.setItem('clutch_design', q); if (localStorage.getItem('clutch_design') !== 'cs') document.documentElement.classList.add('dsV'); } catch (e) { document.documentElement.classList.add('dsV'); }</script>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/lowpoly.css">
    <link rel="stylesheet" href="css/hud.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/theme-v.css">
</head>

<body>
    <script src="js/i18n.js"></script>
    <div id="loader"><img src="icon-192.png" alt=""><b>CLUTCH</b><i></i><small id="ldTxt">Lade Spiel…</small></div>
    <script>
        // Falls beim Laden etwas schiefgeht: Hinweis statt endlosem Ladebildschirm
        addEventListener('error', () => { const t = document.getElementById('ldTxt'); if (t && document.getElementById('loader')) t.textContent = 'Fehler beim Laden – bitte Seite neu laden.'; });
    </script>
    <div id="hud">
        <canvas id="radar" width="510" height="510"></canvas>
        <div id="aliveL"></div>
        <div id="aliveR"></div>
        <div id="top">
            <div id="timer">1:55</div>
            <div id="score"></div>
            <div id="roundlbl"></div>
        </div>
        <div id="bomb">⚡ HACK LÄUFT</div>
        <div id="killfeed"></div>
        <div id="msg"></div>
        <div id="sub"></div>
        <div id="cross"><i></i><i></i><i></i><i></i><i></i></div>
        <div id="hitm"><i style="transform:rotate(45deg)"></i><i style="transform:rotate(-45deg)"></i></div>
        <div id="killpop"></div>
        <div id="dmg"></div>
        <div id="flash"></div>
        <div id="scope"></div>
        <div id="dead">
            <div></div>
        </div>
        <div id="prog"><b></b></div>
        <div id="progtxt"></div>
        <div id="bl">
            <div id="hpwrap">
                <div class="slabel">GESUNDHEIT</div>
                <div class="sbar"><i id="hpbar"></i></div>
                <div class="hud-num" id="hp"></div>
            </div>
            <div>
                <div class="slabel">WESTE</div>
                <div class="sbar"><i id="arbar"></i></div>
                <div class="hud-num" id="ar"></div>
            </div>
        </div>
        <div id="money"></div>
        <div id="abil"></div>
        <div id="br">
            <div id="wlist"></div>
            <div id="wname"></div>
            <div class="hud-num" id="ammo"></div>
        </div>
        <div id="touch">
            <div id="tzone"></div><div id="tlook"></div>
            <div id="tstick"><i id="tnub"></i></div>
            <div class="tb" id="tFire">◉</div>
            <div class="tb" id="tFire2">◉</div>
            <div class="tb" id="tJump">⤒</div>
            <div class="tb" id="tCrouch">⤓</div>
            <div class="tb" id="tReload">↻</div>
            <div class="tb" id="tWalk" title="Leise gehen"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 4v14"/><path d="m6 12 6 6 6-6"/><path d="M6 21h12"/></svg></div>
            <div class="tb" id="tUse" title="Aufheben · Fallenlassen · Entschärfen"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11.5v-2a1.5 1.5 0 0 1 3 0V12"/><path d="M14 10.5a1.5 1.5 0 0 1 3 0V12"/><path d="M17 11.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-2a6 6 0 0 1-5.2-3L4.3 14.6a1.5 1.5 0 0 1 2.5-1.6L8 15"/></svg></div>
            <div class="tb" id="tScope">⊕</div>
            <div class="tb" id="tPing" title="Pingen"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
            <div class="tb" id="tAbil" title="Waffe inspizieren"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></div>
            <div class="tb" id="tNext">⇄</div>
            <div class="tb" id="tBuy">$</div>
            <div class="tb" id="tBoard">☰</div>
            <div class="tb spec" id="tSpecL">◀</div>
            <div class="tb spec" id="tSpecR">▶</div>
            <div class="tb spec" id="tSpecM" title="Freecam / Ego">🎥</div>
            <div class="tb spec" id="tFcUp" title="Hoch">⤒</div>
            <div class="tb spec" id="tFcDn" title="Runter">⤓</div>
        </div>
        <div id="buy" class="panel"></div>
        <div id="tspUI"></div>
        <div id="board" class="panel"></div>
    </div>
 <div id="overlay"></div>
 <div id="rotmsg"><span>📱↻</span>Bitte Handy quer halten</div>
 <div id="editbar"><b>Buttons ziehen & ablegen</b><button id="editDone">✓ Fertig</button><button id="editReset">↺ Reset</button></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
